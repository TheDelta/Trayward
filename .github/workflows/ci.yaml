# Checks on every push to main and every pull request
# Locally: `npm run check`
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0" # no Git hooks on the runner
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Lint and checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json # devEngines.runtime
          cache: npm

      - name: Install the tools (package-lock.json, requirements-dev.txt)
        run: |
          npm ci --ignore-scripts
          # Wheels only (no package's setup script runs), but for actionlint-py, a source
          # package that downloads the actionlint binary (docs/maintenance.md)
          python -m pip install --require-hashes --only-binary :all: --no-binary actionlint-py -r requirements-dev.txt

      # Everything but Rust (the next job, on Windows); with the release scripts' tests
      - name: npm run check
        run: npm run check -- --no-rust

      # Known-vulnerable or impostor action commits; only this step gets the token
      - name: zizmor (online audits)
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor .github

  # The logic without the UI (core/) must keep building elsewhere: Clippy checks it,
  # tests included, on Linux (where its `os` module has fallbacks)
  core-linux:
    name: Core on Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustc --version

      - name: Clippy
        run: cargo clippy -p trayward-core --all-targets --locked -- -D warnings

  # The crates against RustSec's advisories, the allowed licenses and sources (deny.toml)
  dependencies:
    name: Rust dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A prebuilt cargo-deny, checked against the action's checksums
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-deny@0.21.0

      - name: cargo-deny
        run: cargo-deny --locked check

      # The release attaches the crates' license texts: each crate must ship one
      - name: Third-party licenses
        run: python3 scripts/licenses.py

  rust:
    name: Rust (${{ matrix.role }})
    runs-on: windows-2025
    defaults:
      run:
        shell: bash # Git Bash; PowerShell is the default on Windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: oldest # rust-version in Cargo.toml
            toolchain: "1.85"
          - role: newest
            toolchain: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust ${{ matrix.toolchain }}
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt,clippy,llvm-tools-preview
          rustup default "$TOOLCHAIN"
          rustc --version

      - name: rustfmt
        if: matrix.role == 'newest'
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        if: matrix.role == 'oldest'
        run: cargo test --locked

      # Broken links and HTML in doc comments (rustdoc lints in Cargo.toml)
      - name: Docs
        if: matrix.role == 'newest'
        run: cargo doc --no-deps --document-private-items --workspace --locked

      # A prebuilt cargo-llvm-cov, checked against the action's checksums (no build
      # from source on every run)
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        if: matrix.role == 'newest'
        with:
          tool: cargo-llvm-cov@0.9.1

      # The same tests, measured; lcov.info is for SonarQube Cloud (sonar.yaml), whose
      # scanner runs on Linux: the files as paths relative to the repository
      - name: Tests (with coverage)
        if: matrix.role == 'newest'
        run: |
          mkdir -p coverage/rust # llvm-cov doesn't make the folder
          cargo llvm-cov --workspace --locked --lcov --output-path coverage/rust/lcov.info
          cargo llvm-cov report --summary-only
          python - <<'EOF'
          import os, pathlib
          report, root = pathlib.Path("coverage/rust/lcov.info"), os.getcwd()
          lines = report.read_text(encoding="utf-8").splitlines(keepends=True)
          fix = lambda l: f"SF:{os.path.relpath(l[3:].strip(), root).replace(os.sep, '/')}\n"
          report.write_text("".join(fix(l) if l.startswith("SF:") else l for l in lines), encoding="utf-8", newline="\n")
          EOF
          grep -m 3 '^SF:' coverage/rust/lcov.info

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && matrix.role == 'newest' }}
        with:
          name: coverage-rust
          path: coverage/rust/
          if-no-files-found: ignore
          retention-days: 7

      # The exe of this commit, to try a change without building it
      - name: Build
        if: matrix.role == 'newest'
        run: cargo build --release --locked

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.role == 'newest'
        with:
          name: trayward-${{ github.sha }}
          path: target/release/trayward.exe
          retention-days: 14

  # SonarQube Cloud: the analysis with this run's coverage, for main and for pull requests
  # from this repository. A fork's pull request gets no secrets in its run, so it isn't
  # analyzed here; its code is analyzed once it's merged. (No workflow_run that checks out
  # a fork's code next to the token.) Needs the secret SONAR_TOKEN and the variables
  # SONAR_ORGANIZATION, SONAR_PROJECT_KEY; without the token it does nothing.
  sonar:
    name: SonarQube Cloud
    needs: rust
    if: >-
      !cancelled() && github.event_name != 'workflow_dispatch' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    steps:
      - name: What to analyze
        id: target
        env:
          TOKEN_SET: ${{ secrets.SONAR_TOKEN != '' }}
          ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          PROJECT: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          if [ "$TOKEN_SET" != true ]; then
            echo "::notice::No SONAR_TOKEN secret: the analysis is skipped"
            exit 0
          fi
          if [ -z "$ORGANIZATION" ] || [ -z "$PROJECT" ]; then
            echo "::error::Set the variables SONAR_ORGANIZATION and SONAR_PROJECT_KEY (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          # Clippy stays off: CI runs it on Windows, where the app builds
          echo "args=-Dsonar.organization=$ORGANIZATION -Dsonar.projectKey=$PROJECT -Dsonar.rust.clippy.enabled=false" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.target.outputs.args
        with:
          fetch-depth: 0 # blame, and main to compare a pull request with
          persist-credentials: false

      # main's analyses carry the version, so SonarQube Cloud marks each release; with
      # "New Code" set to "Previous version", new code is what came since the last one
      - name: Version (main)
        id: version
        if: steps.target.outputs.args && github.event_name == 'push'
        run: |
          version=$(sed -nE '/^\[package\]/,/^\[/{s/^version = "([0-9A-Za-z.+-]+)".*/\1/p}' Cargo.toml | head -n 1)
          if [ -n "$version" ]; then
            echo "args=-Dsonar.projectVersion=$version" >> "$GITHUB_OUTPUT"
            echo "### main at $version" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Coverage report
        if: steps.target.outputs.args
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true # a Rust job that failed early has none; analyze without it
        with:
          name: coverage-rust
          path: coverage/rust

      # The scanner makes a module of each Cargo package (the app, the core) and looks
      # for the report from each module's folder: given as an absolute path, both find
      # it, and with absolute paths in it, each takes its own files
      - name: Coverage paths
        id: coverage
        if: steps.target.outputs.args
        run: |
          if [ -f coverage/rust/lcov.info ]; then
            sed -i "s|^SF:\([^/]\)|SF:$GITHUB_WORKSPACE/\1|" coverage/rust/lcov.info
            grep -m 2 '^SF:' coverage/rust/lcov.info
            echo "args=-Dsonar.rust.lcov.reportPaths=$GITHUB_WORKSPACE/coverage/rust/lcov.info" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No coverage-rust from the Rust job: analyzed without coverage"
          fi

      - name: Analysis
        if: steps.target.outputs.args
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: ${{ steps.target.outputs.args }} ${{ steps.version.outputs.args }} ${{ steps.coverage.outputs.args }}
