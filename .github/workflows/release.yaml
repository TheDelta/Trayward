# Publishes a release. Two ways in:
#
# - Usually: merging the pull request from prepare-release.yaml, i.e. a push to main
#   titled "chore(release): vX.Y.Z" that changes the version in Cargo.toml to that
#   version, which has no tag yet. The first release may keep the version.
# - By hand: pushing a version tag (git tag v1.2.3 && git push origin v1.2.3); the
#   tag must match the version in Cargo.toml at that commit.
#
# It builds trayward.exe on Windows, then creates the tag (if needed) and the GitHub
# release with the exe, its SHA-256 sum, and the version's section of CHANGELOG.md as
# notes. Public repositories also get a signed build provenance attestation.
#
# No build cache: a release shouldn't depend on cache entries other workflow runs
# wrote.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

# The Rust that builds the published exe; raise it by pull request (CI tests the
# newest stable and the oldest supported one)
env:
  RUST: "1.100.0"

# No workflow-wide concurrency: GitHub keeps one pending run per group, so a later
# push could cancel a waiting release. Only the jobs of real releases queue (below).

jobs:
  version:
    name: Is this a release?
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the previous commit and the tags
          persist-credentials: false

      - id: check
        env:
          BEFORE: ${{ github.event.before }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          version=$(python3 scripts/release.py current)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag is $GITHUB_REF_NAME, but the version is $version"; exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # On main only the release pull request publishes, not any change of the
          # version
          title=$(printf '%s\n' "$MESSAGE" | head -n 1)
          case "$title" in
            "chore(release): v$version" | "chore(release): v$version "*) ;;
            *)
              echo "Not a release commit ($title): nothing to release."
              echo "release=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "No previous commit to compare with: nothing to release (push a tag to release by hand)."
            echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          mkdir -p "$RUNNER_TEMP/before"
          before=$(git show "$BEFORE:Cargo.toml" > "$RUNNER_TEMP/before/Cargo.toml" 2>/dev/null \
            && python3 scripts/release.py --root "$RUNNER_TEMP/before" current 2>/dev/null || true)
          first=false
          [ -z "$(git tag --list 'v[0-9]*')" ] && first=true
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already tagged: nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif [ "$before" = "$version" ] && [ "$first" = false ]; then
            echo "Version unchanged ($version): nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version ${before:-?} -> $version: releasing v$version."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      # Before the build, so missing notes fail before ten minutes of Windows
      - name: Release notes exist
        if: steps.check.outputs.release == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: python3 scripts/release.py notes --github "$VERSION" > /dev/null

  build:
    name: Build trayward.exe
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: windows-2025
    concurrency:
      group: release-build
      cancel-in-progress: false
    defaults:
      run:
        shell: bash # Git Bash; PowerShell is the default on Windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust ${{ env.RUST }}
        run: |
          rustup toolchain install "$RUST" --profile minimal
          rustup default "$RUST"
          rustc --version

      - name: Tests
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-exe
          path: target/release/trayward.exe
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release v${{ needs.version.outputs.version }}
    needs: [version, build]
    runs-on: ubuntu-24.04
    concurrency:
      group: release-publish
      cancel-in-progress: false
    permissions:
      contents: write # the tag and the GitHub release
      id-token: write # sign the build provenance (Sigstore)
      attestations: write # store it with the repository
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Release notes from CHANGELOG.md
        run: python3 scripts/release.py notes --github "$VERSION" > "$RUNNER_TEMP/notes.md"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-exe
          path: ${{ runner.temp }}/dist

      - name: SHA-256 sum
        working-directory: ${{ runner.temp }}/dist
        run: |
          sha256sum trayward.exe > trayward.exe.sha256
          cat trayward.exe.sha256 >> "$GITHUB_STEP_SUMMARY"

      # gh attestation verify trayward.exe --owner <owner> (public repositories only)
      - name: Build provenance attestation
        if: github.repository_visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/dist/trayward.exe

      # Tags here, in the same run: a tag pushed with this token wouldn't start a workflow again
      - name: Tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -- --title "Trayward $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          case "$VERSION" in *-*) set -- "$@" --prerelease ;; esac
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            set -- "$@" --verify-tag
          else
            set -- "$@" --target "$GITHUB_SHA"
          fi
          gh release create "v$VERSION" "$@" \
            "$RUNNER_TEMP/dist/trayward.exe" "$RUNNER_TEMP/dist/trayward.exe.sha256"
