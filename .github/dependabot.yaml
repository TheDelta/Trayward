# Dependabot
# New releases wait 3 days (cooldown): a hijacked release is usually caught and
# pulled by then. .npmrc's min-release-age is the same, so npm accepts what
# Dependabot proposes.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: fix(deps) # the crates ship in trayward.exe
    groups:
      crates:
        update-types: [minor, patch]

  # The fuzzer's own workspace: nothing of it ships
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore(deps-dev)
    groups:
      fuzz-crates:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore(deps-dev) # development tools only
    groups:
      dev-tools:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore(deps-dev)
    groups:
      dev-tools:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
