# CSpell: spelling in code, docs and configs (npm run check, the hooks, PR titles)
version: "0.2"
language: en-GB,en,de-DE
import:
  - "@cspell/dict-de-de/cspell-ext.json" # the German translations
useGitignore: true
ignorePaths:
  - .git
  - .husky/_
  - target
  - node_modules
  - .venv
  - package.json
  - package-lock.json
  - Cargo.lock
  - requirements-dev.txt
  - CODE_OF_CONDUCT.md # third-party text
  - "*.ico"
  - "*.png"
ignoreRegExpList:
  - uses:\s*\S+ # pinned actions
  # Package names in Dependabot titles: "bump a, b and c from"
  - (?<=\bbump )[@\w./-]+(?:(?:, | and )[@\w./-]+)*
  # Win32 constants and Segoe Fluent Icons code points
  - /\b[A-Z][A-Z0-9]*_[A-Z0-9_]+\b/g # case-sensitive: a plain pattern ignores case
  - \\u\{[0-9A-Fa-f]+\}
  # Win32 type names (BITMAPINFO, HMONITOR)
  - /\b[A-Z][A-Z0-9]{3,}\b/g
  # A test with accented letters
  - äöüßéèê
  # SHA-256 sums and hex colours
  - \b[0-9a-f]{12,}\b
overrides:
  - filename: "**/*.rs"
    languageId: rust
  - filename: ".github/workflows/*.yaml"
    dictionaries: [shell, bash]
