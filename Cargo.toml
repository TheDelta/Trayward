[package]
name = "trayward"
version = "0.1.0"
authors = ["Alex 'Delta' Diller"]
edition = "2024"
rust-version = "1.85"
description = "Claude Code usage limits and session status in the Windows 11 taskbar"
license = "MIT"
readme = "README.md"
repository = "https://github.com/TheDelta/trayward"
homepage = "https://github.com/TheDelta/trayward"
keywords = ["claude", "claude-code", "taskbar", "windows", "usage"]
categories = ["development-tools"]
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
# preserve_order keeps the key order of ~/.claude/settings.json when hooks are installed.
serde_json = { version = "1.0.154", features = ["preserve_order"] }
# Point/matrix types used by the Direct2D API of the `windows` crate.
windows-numerics = "0.3.1"

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Globalization",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Ole",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_UI_Controls",
    "Win32_Graphics_Imaging",
    "Win32_Media_Audio",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "allow"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
