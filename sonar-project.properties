# SonarQube Cloud, analyzed in CI (.github/workflows/sonar.yaml) with the tests' coverage.
# Organization and project key come from the repository's variables.
sonar.sources=src,build.rs,scripts
sonar.tests=scripts/tests
sonar.exclusions=scripts/tests/**
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11, 3.12, 3.13, 3.14

# Written by CI's Rust job (ci.yaml), downloaded by sonar.yaml
sonar.rust.lcov.reportPaths=coverage/rust/lcov.info
# The scanner runs on Linux; Trayward builds on Windows only (CI runs Clippy there)
sonar.rust.clippy.enabled=false
# No tests measure these: the dev tools in Node
sonar.coverage.exclusions=scripts/**/*.mjs
