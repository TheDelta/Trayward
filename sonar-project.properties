# SonarQube Cloud, analyzed in CI (.github/workflows/sonar.yaml) with the tests' coverage.
# Organization and project key come from the repository's variables.
sonar.sources=src,core/src,build.rs,scripts
sonar.tests=scripts/tests
sonar.exclusions=scripts/tests/**
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11, 3.12, 3.13, 3.14, 3.15

# Written by CI's Rust job (ci.yaml), downloaded by sonar.yaml
sonar.rust.lcov.reportPaths=coverage/rust/lcov.info
# Clippy runs in CI with warnings as errors (Windows: everything; Linux: the core), so there's
# nothing left for the scanner to report
sonar.rust.clippy.enabled=false
# No tests measure these: the dev tools in Node
sonar.coverage.exclusions=scripts/**/*.mjs

# Findings that were looked at and stay as they are, each with its reason
# (docs/maintenance.md, "SonarQube Cloud").
sonar.issue.ignore.multicriteria=files,git,path,app,flyout,settings,statistics,widget
# The release scripts are command-line tools: the files they read and write are the ones their
# caller names. The workflows pass fixed paths, never anything from a pull request.
sonar.issue.ignore.multicriteria.files.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.files.resourceKey=scripts/**/*.py
# changelog.git() runs git with arguments the script writes itself; the one that comes from
# outside (the commit to start from) is checked to be a hash, and follows --end-of-options.
sonar.issue.ignore.multicriteria.git.ruleKey=pythonsecurity:S8705
sonar.issue.ignore.multicriteria.git.resourceKey=scripts/changelog.py
# The dev scripts start git, cargo and the linters from PATH, on the developer's own PC or
# CI's runner: that is where those tools are. Windows' own programs are started by full path.
sonar.issue.ignore.multicriteria.path.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.path.resourceKey=scripts/**/*.mjs
# One function lays out and draws each window (and the app's one handler takes every event in
# turn): the layout is written once, and measuring and drawing can't drift apart (AGENTS.md,
# "The app's code"). Such a function is long by design, and no test draws a window, so splitting
# them to satisfy the complexity limit would risk what users see. The limit holds for the rest.
sonar.issue.ignore.multicriteria.app.ruleKey=rust:S3776
sonar.issue.ignore.multicriteria.app.resourceKey=src/app.rs
sonar.issue.ignore.multicriteria.flyout.ruleKey=rust:S3776
sonar.issue.ignore.multicriteria.flyout.resourceKey=src/flyout.rs
sonar.issue.ignore.multicriteria.settings.ruleKey=rust:S3776
sonar.issue.ignore.multicriteria.settings.resourceKey=src/settings_window.rs
sonar.issue.ignore.multicriteria.statistics.ruleKey=rust:S3776
sonar.issue.ignore.multicriteria.statistics.resourceKey=src/stats_window.rs
sonar.issue.ignore.multicriteria.widget.ruleKey=rust:S3776
sonar.issue.ignore.multicriteria.widget.resourceKey=src/widget.rs
