# lychee (link checker), used by .github/workflows/links.yaml
exclude_path = ["node_modules", ".venv", "target", "CHANGELOG.md"] # compare links exist only after a release
exclude = [
  "^https?://(www\\.)?example\\.(com|org)", # placeholders in the docs
  "^https?://(localhost|127\\.0\\.0\\.1)", # local addresses in examples
  "(?i)^https://github\\.com/TheDelta/Trayward/(discussions|security|issues/new)", # need a login (any case: GitHub's names have none)
  "^https://github\\.com/settings/", # the user's own settings: need a login
  "^https://gitlab\\.com/-/user_settings/", # likewise
]
accept = ["200..=299", "429"] # 429: rate-limited, not broken
max_retries = 3
timeout = 20
